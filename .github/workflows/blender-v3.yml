name: Blender V3 Asset Sample

on:
  push:
    paths:
      - 'scripts/blender_v3.py'
      - 'assets/v3/**'
      - '.github/workflows/blender-v3.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg libegl1 libgl1 python3-numpy
          blender --version
          python3 - <<'PY'
          import numpy
          print('system numpy', numpy.__version__)
          PY
          blender --background --python-expr "import numpy; print('blender numpy', numpy.__version__)"

      - name: Build and render V3 sample
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output
          mkdir -p output
          blender --background --python scripts/blender_v3.py 2>&1 | tee output/blender-v3.log
          if grep -Eiq 'Traceback|ModuleNotFoundError|RuntimeError: Error: Python|Blender quit unexpectedly' output/blender-v3.log; then
            echo 'Blender reported a Python/runtime error.' >&2
            exit 1
          fi
          test -s output/blender-video-store-v3.mp4
          test -s output/blender-video-store-v3.blend

      - name: QC V3 sample
        shell: bash
        run: |
          set -euo pipefail
          test -s output/blender-video-store-v3.mp4
          ffprobe -v error \
            -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
            -of default=nw=1 output/blender-video-store-v3.mp4 | tee output/ffprobe-v3.txt
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/blender-video-store-v3.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/blender-video-store-v3.mp4)
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/blender-video-store-v3.mp4)
          test "$WIDTH" = "540"
          test "$HEIGHT" = "960"
          awk -v d="$DURATION" 'BEGIN { exit !(d >= 4.5 && d <= 5.5) }'

      - name: Upload V3 sample
        uses: actions/upload-artifact@v4
        with:
          name: blender-video-store-v3
          path: |
            output/blender-video-store-v3.mp4
            output/blender-video-store-v3.blend
            output/blender-v3.log
            output/ffprobe-v3.txt
          retention-days: 7

      - name: Send V3 sample to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@output/blender-video-store-v3.mp4" \
            -F "supports_streaming=true" \
            -F "caption=🎬 Content Factory V3 · asset-driven Blender sample · 5 sec · 9:16"
