name: Content Factory V3.2 Cinematic Test

on:
  push:
    paths:
      - '.v32-trigger/**'

jobs:
  render-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip edge-tts pillow
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core jq
      - name: Build stable PNG brand logo
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          dst=Path('assets/brand/logo.png'); dst.parent.mkdir(parents=True,exist_ok=True)
          W,H=900,300; im=Image.new('RGBA',(W,H),(0,0,0,0)); d=ImageDraw.Draw(im)
          fp='/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf'
          if not Path(fp).exists(): fp='/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf'
          font=ImageFont.truetype(fp,92); small=ImageFont.truetype(fp,34)
          d.rounded_rectangle((18,18,882,282),radius=64,fill=(8,12,18,224),outline=(255,255,255,48),width=3)
          d.ellipse((62,67,230,235),outline=(255,255,255,230),width=12); d.polygon([(132,112),(132,190),(190,151)],fill=(255,255,255,235))
          d.text((830,72),'خلف الشاشة',font=font,fill=(255,255,255,255),anchor='ra',direction='rtl')
          d.text((825,190),'قصص ما وراء التقنية',font=small,fill=(220,225,232,220),anchor='ra',direction='rtl')
          im.save(dst,'PNG',optimize=True)
          PY
      - name: Resolve Video 007
        id: story
        run: |
          ID=007
          STORY_DIR="$(find content -maxdepth 1 -type d -name "${ID}-*" | head -n1)"
          test -n "$STORY_DIR"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "slug=$(basename "$STORY_DIR")" >> "$GITHUB_OUTPUT"
      - name: Stage masters from permanent GitHub asset library
        run: |
          python scripts/stage_library_assets.py --id '007'
          test "$(find assets/stories/${{ steps.story.outputs.slug }}/scenes -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 8
      - name: Generate narration
        run: python scripts/generate_voice_item.py --id '007'
      - name: Render V3.2 visible cinematic motion
        run: python scripts/render_item_v32.py --id '007'
      - name: Verify outro
        run: |
          META="output/${{ steps.story.outputs.slug }}-render.json"
          test "$(jq -r '.cinematic_outro' "$META")" = 'true'
          test -s "output/${{ steps.story.outputs.slug }}-outro.mp4"
      - name: Run QC
        run: python scripts/qc_video.py --id '007' --min-duration 35 --max-duration 75
      - name: Send V3.2 video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VIDEO="output/${{ steps.story.outputs.slug }}-preview.mp4"
          RESPONSE="$(curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@${VIDEO}" -F "supports_streaming=true" -F "caption=🎬 خلف الشاشة | 007 | V3.2 permanent-library test")"
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null
          echo "Telegram V3.2 delivery successful. message_id=$(echo "$RESPONSE" | jq -r '.result.message_id')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 007-v32-library-${{ github.run_number }}
          retention-days: 30
          path: |
            output/
            assets/stories/${{ steps.story.outputs.slug }}/scenes/
            assets/stories/${{ steps.story.outputs.slug }}/library-selection.json
            assets/library/manifest.json
            assets/brand/logo.png
