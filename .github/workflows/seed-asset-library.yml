name: Seed Permanent Asset Library

on:
  push:
    paths:
      - '.library-trigger/**'

permissions:
  contents: write
  actions: read

jobs:
  seed-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Download validated Video 007 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .seed007
          mkdir -p .seed007
          gh run download 33213458124 \
            --repo "$GITHUB_REPOSITORY" \
            --name '007-blackberry-flux-cinematic-41' \
            --dir .seed007
          test -d .seed007/assets/stories/007-blackberry/scenes
          test "$(find .seed007/assets/stories/007-blackberry/scenes -maxdepth 1 -name '*.png' | wc -l)" -eq 8

      - name: Convert masters to permanent WebP library
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          src = Path('.seed007/assets/stories/007-blackberry/scenes')
          dst = Path('assets/library/technology/blackberry')
          dst.mkdir(parents=True, exist_ok=True)
          items = []

          labels = [
              'executive-smartphone-era',
              'physical-keyboard-closeup',
              'mobile-email-culture',
              'touchscreen-disruption',
              'incumbent-confidence',
              'app-centric-shift',
              'former-market-leader-fading',
              'keyboard-vs-touchscreen-future',
          ]

          for idx, png in enumerate(sorted(src.glob('*.png')), start=1):
              im = Image.open(png).convert('RGB')
              out = dst / f'{idx:03d}.webp'
              im.save(out, 'WEBP', quality=84, method=6)
              digest = hashlib.sha256(out.read_bytes()).hexdigest()
              items.append({
                  'id': f'tech-blackberry-{idx:03d}',
                  'path': out.as_posix(),
                  'category': 'technology',
                  'topic': 'blackberry-smartphone-history',
                  'label': labels[idx-1],
                  'orientation': 'portrait',
                  'width': im.width,
                  'height': im.height,
                  'text_free': True,
                  'logo_free': True,
                  'sha256': digest,
                  'source': 'validated-video-007-master',
              })

          manifest_path = Path('assets/library/manifest.json')
          manifest = {
              'schema_version': 1,
              'library_name': 'Content Factory Visual Library',
              'brand': 'خلف الشاشة',
              'selection_policy': 'semantic-first, no-baked-text, portrait-only',
              'items': items,
          }
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Permanent library seeded with {len(items)} validated assets')
          PY

      - name: Validate permanent library
        run: |
          test "$(find assets/library/technology/blackberry -maxdepth 1 -name '*.webp' | wc -l)" -eq 8
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          data=json.loads(Path('assets/library/manifest.json').read_text(encoding='utf-8'))
          assert len(data['items']) == 8
          for item in data['items']:
              p=Path(item['path'])
              assert p.exists() and p.stat().st_size > 10000
              with Image.open(p) as im:
                  assert im.height > im.width
                  assert im.width >= 900 and im.height >= 1400
          print('Library QC passed')
          PY

      - name: Commit permanent library to repository
        run: |
          git config user.name 'content-factory-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/library
          if git diff --cached --quiet; then
            echo 'Library already committed; nothing to do.'
            exit 0
          fi
          git commit -m 'Seed permanent visual asset library from validated Video 007 masters'
          git push origin HEAD:main
