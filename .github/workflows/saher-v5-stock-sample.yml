name: Saher V5 Real Stock Sample
on:
  push:
    paths:
      - 'saher-history/v5-stock-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download licensed Baghdad footage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o work/clip1.mp4 'https://rodlzdf-a.akamaihd.net/none/zdf/20/04/200428_148_0055303952_Gruendung_Bagdad_CC_tex/2/200428_148_0055303952_Gruendung_Bagdad_CC_tex_3360k_p36v15.mp4'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o work/clip2.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Baghdad%20in%201922.webm'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o work/clip3.webm 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Al-Sarafiya%20bridge%20on%20Tigris%20River%20at%20night%20in%20Baghdad.webm'
          for f in work/clip1.mp4 work/clip2.webm work/clip3.webm; do
            echo "== $f =="
            ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$f"
          done
      - name: Build 60 second real stock sample
        run: |
          set -euo pipefail
          ffmpeg -y \
            -ss 2 -i work/clip1.mp4 \
            -stream_loop 1 -i work/clip2.webm \
            -stream_loop 1 -i work/clip3.webm \
            -filter_complex "\
            [0:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,trim=duration=24,setpts=PTS-STARTPTS,eq=brightness=-0.025:contrast=1.05:saturation=0.86,vignette=PI/5[v0];\
            [1:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,trim=duration=18,setpts=PTS-STARTPTS,eq=brightness=-0.045:contrast=1.07:saturation=0.72,vignette=PI/5[v1];\
            [2:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,trim=duration=20,setpts=PTS-STARTPTS,eq=brightness=-0.05:contrast=1.06:saturation=0.76,vignette=PI/5[v2];\
            [v0][v1]xfade=transition=fade:duration=1:offset=23[x1];\
            [x1][v2]xfade=transition=fade:duration=1:offset=40[v]" \
            -map '[v]' -t 59 -an -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart work/saher_v5_real_stock_sample.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=nw=1 work/saher_v5_real_stock_sample.mp4
      - name: Write attribution
        run: |
          cat > work/ATTRIBUTION.txt <<'TXT'
          Sources used in this sample:
          1) Die Gruendung Bagdads im 8. Jahrhundert — ZDF/Terra X — CC BY-SA 4.0.
          2) Baghdad in 1922 — Wikimedia Commons source page; verify source/license before publication.
          3) Al-Sarafiya bridge on Tigris River at night in Baghdad — Mohammad Al-jamaliy — CC BY 3.0.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: saher-v5-real-stock-sample
          path: |
            work/saher_v5_real_stock_sample.mp4
            work/ATTRIBUTION.txt
          retention-days: 7
