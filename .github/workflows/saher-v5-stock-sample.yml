name: Saher V5 Real Stock Sample
on:
  push:
    paths:
      - 'saher-history/v5-stock-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download Abbasid stock clips from Pixabay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python3 - <<'PY'
          import re, html, urllib.request, pathlib
          pages = [
              'https://pixabay.com/videos/abbasid-era-medieval-middle-east-337383/',
              'https://pixabay.com/videos/abbasid-era-arab-scholar-338470/',
              'https://pixabay.com/videos/abbasid-era-bedouin-rider-338404/',
          ]
          headers={'User-Agent':'Mozilla/5.0'}
          for i,page in enumerate(pages,1):
              req=urllib.request.Request(page,headers=headers)
              text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              text=html.unescape(text)
              urls=re.findall(r'https://cdn\.pixabay\.com/video/[^\"\'<> ]+?\.mp4', text)
              urls=[u.replace('\\u002F','/').replace('\\/','/') for u in urls]
              if not urls:
                  raise SystemExit(f'No mp4 URL found on {page}')
              # Prefer medium/large progressive MP4 and avoid tiny previews when possible.
              urls=sorted(set(urls), key=lambda u: ('tiny' in u, 'small' in u, -len(u)))
              url=urls[0]
              print(f'clip{i}: {url}')
              out=pathlib.Path(f'work/clip{i}.mp4')
              req2=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req2,timeout=60) as r, open(out,'wb') as f:
                  f.write(r.read())
          PY
          for f in work/clip*.mp4; do
            echo "== $f =="
            ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$f"
          done
      - name: Build 60 second real stock sample
        run: |
          set -euo pipefail
          ffmpeg -y \
            -stream_loop 6 -i work/clip1.mp4 \
            -stream_loop 6 -i work/clip2.mp4 \
            -stream_loop 6 -i work/clip3.mp4 \
            -filter_complex "\
            [0:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,trim=duration=21,setpts=PTS-STARTPTS,eq=brightness=-0.025:contrast=1.05:saturation=0.86,vignette=PI/5[v0];\
            [1:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,trim=duration=20,setpts=PTS-STARTPTS,eq=brightness=-0.035:contrast=1.05:saturation=0.84,vignette=PI/5[v1];\
            [2:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,trim=duration=21,setpts=PTS-STARTPTS,eq=brightness=-0.03:contrast=1.06:saturation=0.82,vignette=PI/5[v2];\
            [v0][v1]xfade=transition=fade:duration=1:offset=20[x1];\
            [x1][v2]xfade=transition=fade:duration=1:offset=39[v]" \
            -map '[v]' -t 59 -an -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart work/saher_v5_real_stock_sample.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=nw=1 work/saher_v5_real_stock_sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: saher-v5-real-stock-sample
          path: work/saher_v5_real_stock_sample.mp4
          retention-days: 7
