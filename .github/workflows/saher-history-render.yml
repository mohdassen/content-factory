name: Saher History Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saher-history-render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download approved narration artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/audio
          gh run download 33328482364 -n saher-history-baghdad-episode01-audio -D build/audio
          find build/audio -type f -maxdepth 2 -print
      - name: Build original V3 sleep ambience
        run: |
          mkdir -p build
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/audio/*.mp3 | head -1)
          ffmpeg -y \
            -f lavfi -i "sine=frequency=110:sample_rate=44100:duration=${DUR}" \
            -f lavfi -i "sine=frequency=146.83:sample_rate=44100:duration=${DUR}" \
            -f lavfi -i "sine=frequency=164.81:sample_rate=44100:duration=${DUR}" \
            -filter_complex "[0:a]volume=0.020[a0];[1:a]volume=0.013[a1];[2:a]volume=0.010[a2];[a0][a1][a2]amix=3,afade=t=in:st=0:d=5,afade=t=out:st=$(python3 -c 'print(max(0,float(\"'$DUR'\")-6))'):d=6[amb]" \
            -map '[amb]' build/ambient.wav
      - name: Mix Hamed Calm with approved V3 music level
        run: |
          VOICE=$(find build/audio -name '*.mp3' | head -1)
          ffmpeg -y -i "$VOICE" -i build/ambient.wav \
            -filter_complex "[0:a]volume=1.0[voice];[1:a]volume=2.1,highpass=f=65,lowpass=f=5000[bg];[bg][voice]sidechaincompress=threshold=0.06:ratio=1.7:attack=40:release=800[duck];[voice][duck]amix=inputs=2:duration=first:weights='1 0.95':normalize=0,alimiter=limit=0.96[out]" \
            -map '[out]' -c:a aac -b:a 192k build/final_audio.m4a
      - name: Create cinematic 16:9 visual master
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/final_audio.m4a)
          ffmpeg -y -f lavfi -i "color=c=0x130f0a:s=1920x1080:r=30:d=${DUR}" \
            -i build/final_audio.m4a \
            -vf "drawbox=x=0:y=0:w=iw:h=ih:color=0x1d130b@0.45:t=fill,drawtext=text='SAHER HISTORY':fontcolor=0xD8C39A:fontsize=48:x=(w-text_w)/2:y=h*0.82" \
            -map 0:v -map 1:a -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -c:a copy -shortest -movflags +faststart build/episode01_master.mp4
      - name: QC
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json build/episode01_master.mp4 | tee build/qc.json
          test -s build/episode01_master.mp4
      - name: Upload episode master
        uses: actions/upload-artifact@v4
        with:
          name: saher-history-episode01-master
          path: |
            build/episode01_master.mp4
            build/qc.json
          retention-days: 14
          compression-level: 0
