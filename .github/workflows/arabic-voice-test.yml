name: Arabic Voice Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arabic-voice-test.yml'

jobs:
  generate-voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Edge TTS and FFmpeg
        run: |
          pip install edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate Hamed Calm Baghdad V3 pronunciation sample
        run: |
          mkdir -p voice_samples
          cat > sample.txt <<'EOF'
          تَخَيَّلْ أَنَّكَ فَتَحْتَ عَيْنَيْكَ ذَاتَ صَبَاحٍ فِي بَغْدَاد، قَبْلَ أَكْثَرَ مِنْ أَلْفِ عَام. مِنْ نَافِذَةِ بَيْتِكَ تَرَى ضَوْءَ الفَجْرِ يَنْعَكِسُ عَلَى نَهْرِ دِجْلَة، وَتَسْمَعُ خُطُوَاتِ التُّجَّارِ وَهُمْ يَفْتَحُونَ حَوَانِيتَهُمْ. تَمْشِي بَيْنَ الوَرَّاقِينَ، فَتَجِدُ كُتُبًا تُنْسَخُ بِاليَدِ، وَعُلَمَاءَ يُنَاقِشُونَ الطِّبَّ وَالفَلَكَ وَالحِسَاب. وَهُنَا، فِي بَغْدَادَ العَبَّاسِيَّة، تَبْدَأُ حِكَايَتُنَا.
          EOF
          edge-tts --voice ar-SA-HamedNeural --rate=-12% --pitch=-8Hz --text "$(cat sample.txt)" --write-media voice_samples/baghdad_v3_hamed_calm_pronunciation.mp3
      - name: Validate narration
        run: |
          test -s voice_samples/baghdad_v3_hamed_calm_pronunciation.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice_samples/baghdad_v3_hamed_calm_pronunciation.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: baghdad-v3-hamed-calm-pronunciation
          path: voice_samples/baghdad_v3_hamed_calm_pronunciation.mp3
          retention-days: 7
