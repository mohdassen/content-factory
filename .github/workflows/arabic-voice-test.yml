name: Arabic Voice Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arabic-voice-test.yml'

jobs:
  generate-voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Edge TTS and FFmpeg
        run: |
          pip install edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate full Baghdad episode narration
        run: |
          mkdir -p voice_samples
          cat > episode.txt <<'EOF'
          تَخَيَّلْ أَنَّكَ فَتَحْتَ عَيْنَيْكَ ذَاتَ صَبَاحٍ فِي بَغْدَاد، قَبْلَ أَكْثَرَ مِنْ أَلْفِ عَام. لا سَيَّارَاتَ فِي الشَّوَارِع، وَلا أَضْوَاءَ كَهْرَبَائِيَّة. وَمَعَ ذَلِكَ، فَإِنَّ المَدِينَةَ قَدْ بَدَأَتْ يَوْمَهَا مُنْذُ اللَّحَظَاتِ الأُولَى لِلْفَجْر.

          مِنْ نَافِذَةِ بَيْتِكَ، تَرَى ضَوْءَ الصَّبَاحِ يَنْعَكِسُ عَلَى نَهْرِ دِجْلَة. الهَوَاءُ أَلْطَفُ فِي هَذِهِ السَّاعَة، وَالأَزِقَّةُ مَا زَالَتْ هَادِئَة. ثُمَّ، شَيْئًا فَشَيْئًا، تَبْدَأُ بَغْدَادُ فِي الاِسْتِيقَاظ.

          تَسْمَعُ خُطُوَاتِ التُّجَّارِ وَهُمْ يَتَّجِهُونَ إِلَى حَوَانِيتِهِم. وَتَرَى الحِرَفِيِّينَ يَسْتَعِدُّونَ لِيَوْمٍ جَدِيد. هُنَاكَ مَنْ يَخْبِزُ الخُبْز، وَهُنَاكَ مَنْ يَحْمِلُ البَضَائِع، وَآخَرُونَ يَفْتَحُونَ أَبْوَابَ دَكَاكِينِهِمْ وَيَرْتِّبُونَ مَا سَيَبِيعُونَهُ لِلنَّاس.

          وَعِنْدَمَا تَصِلُ إِلَى السُّوق، تَتَغَيَّرُ الأَصْوَاتُ وَالرَّوَائِح. رَائِحَةُ الخُبْزِ السَّاخِنِ تَمْتَزِجُ بِرَوَائِحِ التَّوَابِلِ وَالعُطُور. بَضَائِعُ جَاءَ بَعْضُهَا مِنْ مَنَاطِقَ بَعِيدَة، عَبْرَ طُرُقِ التِّجَارَةِ الَّتِي رَبَطَتْ بَغْدَادَ بِمُدُنٍ وَبِلَادٍ كَثِيرَة.

          فِي العَصْرِ العَبَّاسِي، كَانَتْ بَغْدَادُ مَرْكَزًا مُهِمًّا لِلتِّجَارَة. وَكَانَتْ أَسْوَاقُهَا تَضُمُّ أَصْحَابَ مِهَنٍ مُخْتَلِفَة. تَمْشِي فِي السُّوقِ فَتَرَى البَائِعَ وَالصَّانِعَ وَالحَمَّالَ وَالمُسَافِر. وَرُبَّمَا تَسْمَعُ لُغَاتٍ وَلَهَجَاتٍ مُخْتَلِفَة مِنْ أُنَاسٍ وَصَلُوا إِلَى المَدِينَةِ مِنْ أَمَاكِنَ بَعِيدَة.

          ثُمَّ تَبْتَعِدُ قَلِيلًا عَنْ ضَجِيجِ السُّوق. وَتَدْخُلُ إِلَى مَكَانٍ أَكْثَرَ هُدُوءًا. هُنَا يَجْلِسُ الوَرَّاقُون. أَمَامَهُمْ أَوْرَاقٌ وَحِبْرٌ وَكُتُب. وَبِأَيْدِيهِمْ تُنْسَخُ الكَلِمَاتُ سَطْرًا بَعْدَ سَطْر.

          الكِتَابُ فِي ذَلِكَ الزَّمَنِ لَمْ يَكُنْ مِلَفًّا يُنْسَخُ فِي ثَوَانٍ. كَانَ عَمَلًا يَحْتَاجُ إِلَى الوَقْتِ وَالدِّقَّة. وَمِنْ حَوْلِ الكُتُبِ نَشَأَ عَالَمٌ مِنَ العِلْمِ وَالنِّقَاشِ وَالتَّرْجَمَة.

          وَفِي بَغْدَادَ العَبَّاسِيَّة، ازْدَهَرَتْ حَرَكَةُ التَّرْجَمَة. نُقِلَتْ أَعْمَالٌ فِي الطِّبِّ وَالفَلَكِ وَالحِسَابِ وَالفَلْسَفَةِ إِلَى العَرَبِيَّة. وَأَصْبَحَتِ المَدِينَةُ وَاحِدَةً مِنْ أَهَمِّ مَرَاكِزِ المَعْرِفَةِ فِي عَالَمِهَا.

          تَخَيَّلْ أَنَّكَ جَالِسٌ فِي مَجْلِسٍ هَادِئ. أَمَامَكَ عَالِمٌ يَقْرَأُ مِنْ كِتَاب، وَبِجَانِبِهِ رَجُلٌ يُدَوِّنُ مُلَاحَظَات. وَفِي زَاوِيَةٍ أُخْرَى يَدُورُ نِقَاشٌ عَنْ حَرَكَةِ النُّجُومِ أَوْ عَنْ دَوَاءٍ جَدِيد.

          وَعِنْدَ الظُّهْر، يَكُونُ ضَوْءُ الشَّمْسِ أَقْوَى. تَبْحَثُ عَنْ الظِّل، وَتَتَجِهُ نَحْوَ نَهْرِ دِجْلَة. عَلَى المَاءِ تَرَى القَوَارِبَ تَعْبُرُ بِهُدُوء. بَعْضُهَا يَحْمِلُ النَّاس، وَبَعْضُهَا يَحْمِلُ البَضَائِع.

          النَّهْرُ لَيْسَ مُجَرَّدَ مَنْظَرٍ جَمِيل. إِنَّهُ جُزْءٌ مِنْ حَيَاةِ المَدِينَة. وَمَعَ حَرَكَةِ المَاءِ وَالقَوَارِب، تَشْعُرُ بِأَنَّ بَغْدَادَ تَتَنَفَّسُ عَلَى ضِفَّتَيْ دِجْلَة.

          تَمُرُّ السَّاعَات. يَهْدَأُ الحَرُّ قَلِيلًا. وَتَعُودُ الحَرَكَةُ إِلَى الأَزِقَّة. أَطْفَالٌ يَمْشُونَ مَعَ أَهْلِهِم. رَجُلٌ يَحْمِلُ سَلَّة. تَاجِرٌ يُغْلِقُ صَفْقَة. وَمُسَافِرٌ يَسْأَلُ عَنْ طَرِيقِهِ.

          وَرَاءَ الأَبْوَاب، كَانَتْ لِلْحَيَاةِ المَنْزِلِيَّةِ تَفَاصِيلُهَا أَيْضًا. بُيُوتٌ تَخْتَلِفُ بِحَسَبِ أَحْوَالِ أَصْحَابِهَا، وَطَعَامٌ يُعَدُّ مِنَ الحُبُوبِ وَالخُضْرَوَاتِ وَاللُّحُومِ وَمَا تَوَفَّرَ مِنَ المُكَوِّنَات. وَمَعَ كُلِّ وَجْبَة، هُنَاكَ قِصَصٌ صَغِيرَةٌ لا تَذْكُرُهَا كُتُبُ التَّارِيخِ دَائِمًا.

          نَحْنُ عَادَةً نَقْرَأُ التَّارِيخَ مِنْ خِلَالِ الخُلَفَاءِ وَالحُرُوبِ وَالأَحْدَاثِ الكُبْرَى. لَكِنَّ بَغْدَادَ كَانَتْ أَيْضًا مَلَايِينَ اللَّحَظَاتِ الصَّغِيرَة: خَبَّازٌ يَبْدَأُ عَمَلَهُ قَبْلَ الفَجْر، وَرَّاقٌ يَنْسَخُ كِتَابًا، تَاجِرٌ يَنْتَظِرُ قَافِلَة، وَطِفْلٌ يَرَى دِجْلَةَ كُلَّ يَوْمٍ دُونَ أَنْ يَعْرِفَ أَنَّ مَدِينَتَهُ سَيَقْرَأُ عَنْهَا النَّاسُ بَعْدَ أَلْفِ عَام.

          تَقْتَرِبُ الشَّمْسُ مِنَ الغُرُوب. وَيَتَغَيَّرُ لَوْنُ السَّمَاءِ فَوْقَ دِجْلَة. تَبْدَأُ الحَوَانِيتُ فِي الإِغْلَاق، وَتَخِفُّ الأَصْوَاتُ الَّتِي مَلَأَتِ السُّوقَ طَوَالَ النَّهَار.

          وَمَعَ حُلُولِ اللَّيْل، تَظْهَرُ أَضْوَاءُ المَصَابِيحِ الزَّيْتِيَّة. لَا تُضِيءُ المَدِينَةَ كَمَا تُضِيئُهَا المَصَابِيحُ الحَدِيثَة، بَلْ تَتْرُكُ بَيْنَ الضَّوْءِ وَالظِّلِّ مَسَاحَاتٍ وَاسِعَة. وَفِي هَذَا الهُدُوء، تَبْدُو الأَزِقَّةُ مُخْتَلِفَةً تَمَامًا عَمَّا كَانَتْ عَلَيْهِ فِي النَّهَار.

          تَعُودُ إِلَى بَيْتِكَ. وَقَبْلَ أَنْ تُغْلِقَ عَيْنَيْكَ، تَتَذَكَّرُ مَا رَأَيْتَهُ فِي يَوْمٍ وَاحِد: السُّوق، وَدِجْلَة، وَالقَوَارِب، وَالوَرَّاقِينَ، وَمَجَالِسَ العِلْم، وَالمَصَابِيحَ فِي آخِرِ اللَّيْل.

          لَمْ تَكُنْ بَغْدَادُ مُجَرَّدَ مَدِينَةٍ كَبِيرَة. فِي عَصْرِهَا العَبَّاسِي، كَانَتْ مَكَانًا تَلْتَقِي فِيهِ التِّجَارَةُ بِالمَعْرِفَة، وَيَلْتَقِي فِيهِ المُسَافِرُونَ بِالعُلَمَاء، وَتَعْبُرُ مِنْهُ الأَفْكَارُ كَمَا تَعْبُرُ القَوَارِبُ فَوْقَ دِجْلَة.

          وَالآن، بَعْدَ أَنْ هَدَأَتِ المَدِينَة، دَعْ ضَوْءَ المَصْبَاحِ يَخْفُتُ شَيْئًا فَشَيْئًا. وَدَعْ أَصْوَاتَ بَغْدَادَ القَدِيمَةِ تَبْتَعِدُ. فَقَدِ انْتَهَى يَوْمُنَا الأَوَّلُ هُنَا. وَلَكِنَّ حِكَايَاتِ التَّارِيخِ لَمْ تَنْتَهِ بَعْد.
          EOF
          edge-tts --voice ar-SA-HamedNeural --rate=-12% --pitch=-8Hz --text "$(cat episode.txt)" --write-media voice_samples/baghdad_episode01_hamed_calm.mp3
      - name: Validate narration
        run: |
          test -s voice_samples/baghdad_episode01_hamed_calm.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice_samples/baghdad_episode01_hamed_calm.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: saher-history-baghdad-episode01-audio
          path: voice_samples/baghdad_episode01_hamed_calm.mp3
          retention-days: 7
