name: Saher History Background Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'episodes/**/request.json'
      - 'episodes/**/chapters/**'
      - '.github/workflows/saher-history-worker.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: saher-history-worker
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      episode: ${{ steps.pick.outputs.episode }}
      request_id: ${{ steps.pick.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          for p in sorted(pathlib.Path('episodes').glob('*/request.json')):
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('status')=='pending':
                  print('episode='+p.parent.name)
                  print('request_id='+str(d.get('request_id','unknown')))
                  break
          PY

  render:
    needs: discover
    if: needs.discover.outputs.episode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EPISODE: ${{ needs.discover.outputs.episode }}
      REQUEST_ID: ${{ needs.discover.outputs.request_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lock episode as processing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('episodes')/os.environ['EPISODE']/'request.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('status')=='pending', d.get('status')
          d['status']='processing'
          d['active_run_id']=os.environ['GITHUB_RUN_ID']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'saher-history-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "episodes/$EPISODE/request.json"
          git commit -m "Lock $EPISODE for run ${GITHUB_RUN_ID} [skip ci]"
          git push

      - name: Install production stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --upgrade edge-tts pillow

      - name: Verify direct ChatGPT chapter images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/images
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          from PIL import Image, ImageOps
          root=pathlib.Path('episodes')/os.environ['EPISODE']
          req=json.loads((root/'request.json').read_text(encoding='utf-8'))
          assert req.get('image_provider')=='chatgpt_builtin_only', req.get('image_provider')
          assert req.get('status') in ('pending','processing'), req.get('status')
          chapters=sorted((root/'chapters').glob('*.txt'))
          assert len(chapters)==8, f'Expected 8 chapters, found {len(chapters)}'
          manifest=[]
          for i in range(1,9):
              src=root/'images'/f'{i:02d}.jpg'
              assert src.is_file(), f'Missing direct image {src}'
              raw=src.read_bytes()
              assert len(raw) > 1500, f'Image {i:02d} suspiciously small: {len(raw)}'
              with Image.open(src) as opened:
                  opened.verify()
              img=Image.open(src).convert('RGB')
              assert img.width >= 320 and img.height >= 180, f'Image {i:02d} too small: {img.size}'
              img=ImageOps.fit(img,(1280,720),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
              out=pathlib.Path('build/images')/f'{i:02d}.jpg'
              img.save(out,'JPEG',quality=94,optimize=True)
              manifest.append({'chapter':i,'source':'chatgpt_builtin_only','input_bytes':len(raw),'input_sha256':hashlib.sha256(raw).hexdigest(),'output':str(out)})
          pathlib.Path('build/image_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Verified 8 direct ChatGPT JPEGs')
          PY

      - name: Generate Hamed Calm narration by chapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audio
          i=0
          while IFS= read -r -d '' f; do
            i=$((i+1))
            edge-tts --voice ar-SA-HamedNeural --rate=-12% --pitch=-8Hz --file "$f" --write-media "build/audio/$(printf '%02d' $i).mp3"
          done < <(find "episodes/$EPISODE/chapters" -name '*.txt' -type f -print0 | sort -z)
          test "$i" -eq 8
          : > build/audio/list.txt
          for f in build/audio/[0-9][0-9].mp3; do printf "file '%s'\n" "$(realpath "$f")" >> build/audio/list.txt; done
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i build/audio/list.txt -c:a libmp3lame -b:a 128k build/narration.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/narration.mp3 | tee build/narration_duration.txt

      - name: Build slow cinematic visuals synchronized to narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/video
          : > build/video/list.txt
          n=0
          total=8
          for a in build/audio/[0-9][0-9].mp3; do
            n=$((n+1)); id=$(printf '%02d' $n); img="build/images/$id.jpg"
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$a")
            if [ "$n" -eq "$total" ]; then dur=$(python3 -c "print(float('$dur')+8.0)"); fi
            frames=$(python3 -c "import math; print(math.ceil(float('$dur')*30))")
            ffmpeg -hide_banner -loglevel error -y -loop 1 -i "$img" -t "$dur" \
              -vf "scale=1450:-2,crop=1280:720,zoompan=z='min(zoom+0.00004,1.06)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=$frames:s=1280x720:fps=30" \
              -an -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p "build/video/$id.mp4"
            printf "file '%s'\n" "$(realpath "build/video/$id.mp4")" >> build/video/list.txt
          done
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i build/video/list.txt -c copy build/visual.mp4

      - name: Add approved V3 ambience and 8-second quiet tail
        shell: bash
        run: |
          set -euo pipefail
          NARR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/narration.mp3)
          DUR=$(python3 -c "print(float('$NARR')+8.0)")
          OUTSTART=$(python3 -c "print(max(0,float('$DUR')-8))")
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=110:sample_rate=44100:duration=$DUR" \
            -f lavfi -i "sine=frequency=146.83:sample_rate=44100:duration=$DUR" \
            -f lavfi -i "sine=frequency=164.81:sample_rate=44100:duration=$DUR" \
            -filter_complex "[0:a]volume=0.020[a0];[1:a]volume=0.013[a1];[2:a]volume=0.010[a2];[a0][a1][a2]amix=3,afade=t=in:st=0:d=6,afade=t=out:st=$OUTSTART:d=8[amb]" \
            -map '[amb]' build/ambient.wav
          ffmpeg -hide_banner -loglevel error -y -i build/narration.mp3 -i build/ambient.wav \
            -filter_complex "[0:a]apad=pad_dur=8,volume=1[voice];[1:a]volume=2.1,highpass=f=65,lowpass=f=5000[bg];[bg][voice]sidechaincompress=threshold=0.06:ratio=1.7:attack=40:release=800[duck];[voice][duck]amix=inputs=2:duration=longest:weights='1 0.95':normalize=0,atrim=duration=$DUR,alimiter=limit=0.96[out]" \
            -map '[out]' -c:a aac -b:a 160k build/final_audio.m4a

      - name: Render final episode master
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i build/visual.mp4 -i build/final_audio.m4a \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy -shortest -movflags +faststart "build/${EPISODE}_master.mp4"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "build/${EPISODE}_master.mp4" | tee build/qc.json

      - name: Episode quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          f=f"build/{os.environ['EPISODE']}_master.mp4"
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size','-show_entries','stream=codec_type,codec_name,width,height','-of','json',f],text=True))
          d=float(probe['format']['duration']); size=int(probe['format']['size'])
          video=next(s for s in probe['streams'] if s.get('codec_type')=='video')
          audio=next(s for s in probe['streams'] if s.get('codec_type')=='audio')
          assert 2700 <= d <= 3900, f'Duration outside 45-65 minute gate: {d/60:.2f} min'
          assert video.get('codec_name')=='h264', video
          assert video.get('width')==1280 and video.get('height')==720, video
          assert audio.get('codec_name')=='aac', audio
          assert size > 5_000_000, f'Final file suspiciously small: {size}'
          print(f'QC PASS duration={d/60:.2f}m size={size/1e6:.1f}MB video=H264 1280x720 audio=AAC')
          PY

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saher-${{ env.EPISODE }}-${{ env.REQUEST_ID }}
          path: |
            build/${{ env.EPISODE }}_master.mp4
            build/qc.json
            build/image_manifest.json
            build/narration_duration.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Mark request complete
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'saher-history-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('episodes')/os.environ['EPISODE']/'request.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='done'; d['last_run_id']=os.environ['GITHUB_RUN_ID']; d.pop('active_run_id',None); d.pop('last_error',None)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add "episodes/$EPISODE/request.json"
          git commit -m "Mark $EPISODE complete [skip ci]" || true
          git push

      - name: Notify Telegram success
        if: success()
        shell: bash
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SIZE=$(stat -c%s "build/${EPISODE}_master.mp4")
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            if [ "$SIZE" -lt 48000000 ]; then
              curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@build/${EPISODE}_master.mp4" -F "supports_streaming=true" -F "caption=✅ ساهر مع التاريخ — الحلقة جاهزة\n${URL}" >/dev/null
            else
              curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=✅ ساهر مع التاريخ — الحلقة جاهزة كـ GitHub Artifact: ${URL}" >/dev/null
            fi
          fi

      - name: Mark failed request and notify Telegram
        if: failure()
        shell: bash
        run: |
          set +e
          URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git config user.name 'saher-history-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('episodes')/os.environ['EPISODE']/'request.json'
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              d['status']='failed'; d['last_run_id']=os.environ['GITHUB_RUN_ID']; d['last_error']='production_or_qc_failed'; d.pop('active_run_id',None)
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add "episodes/$EPISODE/request.json" || true
          git commit -m "Mark $EPISODE failed [skip ci]" || true
          git push || true
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl --silent -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=❌ ساهر مع التاريخ — فشل الإنتاج أو QC. التشغيل: ${URL}" >/dev/null || true
          fi
