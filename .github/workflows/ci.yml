name: Content Factory CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Run tests
        run: pytest -q

      - name: Run deterministic demo
        run: python -m src.main --demo > production-package.json

      - name: Render first vertical MP4 technical preview
        run: bash scripts/render_preview.sh

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: production-package
          path: production-package.json

      - name: Upload technical preview video
        uses: actions/upload-artifact@v4
        with:
          name: netflix-blockbuster-tech-preview
          path: output/001-netflix-blockbuster-tech-preview.mp4
