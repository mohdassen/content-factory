name: Content Factory CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Run tests
        run: pytest -q

      - name: Run deterministic demo
        run: python -m src.main --demo > production-package.json

      - name: Generate Arabic neural voice
        run: python scripts/generate_voice.py

      - name: Render first vertical MP4 with voice
        run: bash scripts/render_preview.sh

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: production-package
          path: production-package.json

      - name: Upload publish preview video
        uses: actions/upload-artifact@v4
        with:
          name: netflix-blockbuster-publish-preview
          path: output/001-netflix-blockbuster-preview.mp4

      - name: Upload generated voice
        uses: actions/upload-artifact@v4
        with:
          name: netflix-blockbuster-arabic-voice
          path: output/001-netflix-blockbuster-voice.mp3
