name: HeyGen Telegram Delivery

on:
  push:
    paths:
      - '.heygen-delivery/**'
      - '.github/workflows/heygen-delivery.yml'

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read delivery request
        id: request
        shell: bash
        run: |
          REQUEST='.heygen-delivery/current.txt'
          URL="$(sed -n '1p' "$REQUEST")"
          TITLE="$(sed -n '2p' "$REQUEST")"
          test -n "$URL" || exit 1
          echo "title=${TITLE:-HeyGen review}" >> "$GITHUB_OUTPUT"
          printf '%s' "$URL" > /tmp/video_url

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Prepare assets and source
        shell: bash
        run: |
          test -s assets/brand/logo.png || exit 1
          ffmpeg -hide_banner -loglevel error -y -i assets/brand/logo.png -vf "scale=140:-2" -frames:v 1 /tmp/wm.png
          curl --fail --location --retry 3 --retry-delay 2 "$(cat /tmp/video_url)" -o /tmp/source.mp4
          test -s /tmp/source.mp4

      - name: Detect real content ending
        id: trim
        shell: bash
        run: |
          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/source.mp4)"
          LOG="$(ffmpeg -hide_banner -i /tmp/source.mp4 -af silencedetect=noise=-42dB:d=1.25 -f null - 2>&1 || true)"
          START="$(printf '%s\n' "$LOG" | awk -F 'silence_start: ' '/silence_start:/ {v=$2} END {print v}' | awk '{print $1}')"
          END="$(printf '%s\n' "$LOG" | awk -F 'silence_end: ' '/silence_end:/ {v=$2} END {print v}' | awk '{print $1}')"
          CUT="$(python3 - "$DUR" "$START" "$END" <<'PY'
          import sys
          dur=float(sys.argv[1])
          try: start=float(sys.argv[2]); end=float(sys.argv[3])
          except: start=end=None
          cut=dur
          if start is not None and end is not None and abs(dur-end)<0.6 and dur-start>=1.25:
              cut=start+0.12
          print(f'{cut:.3f}')
          PY
          )"
          echo "cut=$CUT" >> "$GITHUB_OUTPUT"

      - name: Fast watermark render
        shell: bash
        run: |
          CUT='${{ steps.trim.outputs.cut }}'
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/source.mp4 -i /tmp/wm.png \
            -filter_complex "[1:v]format=rgba,colorchannelmixer=aa=0.68[wm];[0:v][wm]overlay=W-w-24:24[v]" \
            -map "[v]" -map 0:a? -t "$CUT" \
            -c:v libx264 -preset ultrafast -crf 22 -threads 0 -pix_fmt yuv420p \
            -c:a copy /tmp/main.mp4
          test -s /tmp/main.mp4

      - name: Build cinematic end card
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -i assets/brand/logo.png \
            -f lavfi -i color=c=0x05070b:s=1080x1920:r=30:d=2.6 \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 \
            -filter_complex "[0:v]scale=760:-2:force_original_aspect_ratio=decrease,format=rgba,fade=t=in:st=0:d=.3:alpha=1,fade=t=out:st=2.2:d=.4:alpha=1[logo];[1:v][logo]overlay=(W-w)/2:(H-h)/2:shortest=1,format=yuv420p[v]" \
            -map "[v]" -map 2:a -t 2.6 -c:v libx264 -preset ultrafast -crf 22 -c:a aac -ar 48000 -ac 2 -b:a 128k -shortest /tmp/outro.mp4

      - name: Join final video
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -y -i /tmp/main.mp4 -i /tmp/outro.mp4 \
            -filter_complex "[0:v]fps=30,setsar=1[v0];[1:v]fps=30,setsar=1[v1];[0:a]aresample=48000,aformat=channel_layouts=stereo[a0];[1:a]aresample=48000,aformat=channel_layouts=stereo[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" -c:v libx264 -preset ultrafast -crf 22 -c:a aac -b:a 128k -movflags +faststart /tmp/final.mp4
          test -s /tmp/final.mp4

      - name: Send branded review to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          RESPONSE="$(curl --fail --silent --show-error --retry 3 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@/tmp/final.mp4" -F "supports_streaming=true" -F "caption=🎬 خلف الرقم | ${{ steps.request.outputs.title }}\n✅ Watermark الجديد + النهاية السينمائية")"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True,d; print('Telegram delivery confirmed:',d['result']['message_id'])"
