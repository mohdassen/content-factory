name: HeyGen Telegram Delivery

on:
  push:
    paths:
      - '.heygen-delivery/**'

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read delivery request
        id: request
        shell: bash
        run: |
          REQUEST='.heygen-delivery/current.txt'
          test -f "$REQUEST" || { echo 'Missing HeyGen delivery request'; exit 1; }
          URL="$(sed -n '1p' "$REQUEST")"
          TITLE="$(sed -n '2p' "$REQUEST")"
          test -n "$URL" || { echo 'Missing HeyGen video URL'; exit 1; }
          echo "title=${TITLE:-HeyGen review}" >> "$GITHUB_OUTPUT"
          printf '%s' "$URL" > /tmp/video_url

      - name: Download HeyGen video
        shell: bash
        run: |
          URL="$(cat /tmp/video_url)"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o /tmp/heygen-review.mp4
          test -s /tmp/heygen-review.mp4
          echo "Downloaded $(du -h /tmp/heygen-review.mp4 | cut -f1) HeyGen review video."

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply Khalf Alraqam branding
        shell: bash
        run: |
          test -s branding/khalf-alraqam-logo.jpg || { echo 'Missing brand asset'; exit 1; }
          ffmpeg -y \
            -i /tmp/heygen-review.mp4 \
            -loop 1 -i branding/khalf-alraqam-logo.jpg \
            -filter_complex "\
              [1:v]scale=150:-1,format=rgba,colorchannelmixer=aa=0.72[wm];\
              [0:v][wm]overlay=W-w-36:36[main];\
              color=c=black:s=1080x1920:d=2[outbg];\
              [1:v]scale=700:-1[outlogo];\
              [outbg][outlogo]overlay=(W-w)/2:(H-h)/2,fade=t=in:st=0:d=0.35,fade=t=out:st=1.55:d=0.45[outro];\
              [main][outro]concat=n=2:v=1:a=0[v];\
              [0:a]aresample=48000[a0];\
              aevalsrc=0:d=2:s=48000:c=stereo[asilence];\
              [a0][asilence]concat=n=2:v=0:a=1[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart \
            /tmp/heygen-branded.mp4
          test -s /tmp/heygen-branded.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/heygen-branded.mp4

      - name: Send branded review to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || { echo 'Telegram secrets unavailable'; exit 1; }
          RESPONSE="$(curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@/tmp/heygen-branded.mp4" \
            -F "supports_streaming=true" \
            -F "caption=🎬 خلف الرقم | ${{ steps.request.outputs.title }}\n✅ Watermark + branded cinematic outro\n\nهذه نسخة المراجعة الجديدة بالشعار المعتمد.")"
          echo "$RESPONSE" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d; print('Telegram delivery confirmed, message_id=', d['result']['message_id'])"
