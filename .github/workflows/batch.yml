name: Content Factory V3 Golden

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Content ID to render (strict V3 masters)'
        required: true
        default: '001'
  push:
    paths:
      - '.factory-trigger/**'

jobs:
  render-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce production architecture lock
        shell: bash
        run: |
          LOCK='config/production_mode.json'
          test -f "$LOCK" || { echo 'BLOCKED: production lock file missing'; exit 1; }
          test "$(jq -r '.architecture' "$LOCK")" = 'V3_GOLDEN_STRICT' || { echo 'BLOCKED: architecture is not strict V3'; exit 1; }
          test "$(jq -r '.production_locked' "$LOCK")" = 'true' || { echo 'BLOCKED: production lock disabled'; exit 1; }
          test "$(jq -r '.approved_master_only' "$LOCK")" = 'true' || { echo 'BLOCKED: approved-master-only is disabled'; exit 1; }
          test "$(jq -r '.allow_stock_fallback' "$LOCK")" = 'false' || { echo 'BLOCKED: stock fallback is forbidden'; exit 1; }
          test "$(jq -r '.allow_storyboard_as_source' "$LOCK")" = 'false' || { echo 'BLOCKED: storyboard source is forbidden'; exit 1; }
          test "$(jq -r '.allow_motion_graphics_fallback' "$LOCK")" = 'false' || { echo 'BLOCKED: motion fallback is forbidden'; exit 1; }
          test "$(jq -r '.telegram_delivery_requires_strict_v3' "$LOCK")" = 'true' || { echo 'BLOCKED: Telegram V3 gate disabled'; exit 1; }
          echo 'Production architecture locked to V3_GOLDEN_STRICT.'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install V3 production dependencies
        run: |
          python -m pip install --upgrade pip edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core jq

      - name: Resolve story
        id: story
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ID='${{ inputs.content_id }}'
          else
            TRIGGER="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^.factory-trigger/' | head -n1)"
            test -n "$TRIGGER" || { echo 'No factory trigger file found in push'; exit 1; }
            ID="$(basename "$TRIGGER" | cut -d. -f1)"
          fi
          STORY_DIR="$(find content -maxdepth 1 -type d -name "${ID}-*" | head -n1)"
          test -n "$STORY_DIR" || { echo "Unknown content id: $ID"; exit 1; }
          SLUG="$(basename "$STORY_DIR")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Resolved $ID -> $SLUG"

      - name: Generate independent AI masters when missing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: gpt-image-1
          IMAGE_SIZE: 1024x1536
          IMAGE_QUALITY: high
        shell: bash
        run: |
          DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"
          COUNT=0
          if [ -d "$DIR" ]; then COUNT="$(find "$DIR" -maxdepth 1 -type f -name '*.png' | wc -l)"; fi
          if [ "$COUNT" -lt 6 ]; then
            python scripts/generate_ai_masters.py --id '${{ steps.story.outputs.id }}'
          else
            echo "Keeping $COUNT existing approved masters."
          fi

      - name: Strict V3 master preflight
        shell: bash
        run: |
          DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"
          test -d "$DIR" || { echo "BLOCKED: approved V3 master directory is missing: $DIR"; exit 1; }
          COUNT="$(find "$DIR" -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) | wc -l)"
          test "$COUNT" -ge 6 || { echo "BLOCKED: only $COUNT approved masters found"; exit 1; }
          echo "Strict V3 preflight passed with $COUNT independent masters."

      - name: Generate Arabic narration and real timing
        run: python scripts/generate_voice_item.py --id '${{ steps.story.outputs.id }}'

      - name: Render strict V3 cinematic MP4
        run: python scripts/render_item.py --id '${{ steps.story.outputs.id }}'

      - name: Run technical quality gate
        run: python scripts/qc_video.py --id '${{ steps.story.outputs.id }}' --min-duration 35 --max-duration 70

      - name: Verify V3 architecture before delivery
        shell: bash
        run: |
          META="output/${{ steps.story.outputs.slug }}-render.json"
          QC="output/${{ steps.story.outputs.id }}-qc.json"
          test "$(jq -r '.architecture' "$META")" = 'V3_GOLDEN_STRICT' || { echo 'BLOCKED: renderer is not strict V3'; exit 1; }
          test "$(jq -r '.all_visuals_are_approved_masters' "$META")" = 'true' || { echo 'BLOCKED: non-master visual detected'; exit 1; }
          test "$(jq -r '.forbidden_fallbacks_enabled' "$META")" = 'false' || { echo 'BLOCKED: forbidden fallback detected'; exit 1; }
          test "$(jq -r '.narration_timing' "$META")" = 'REAL_WORD_BOUNDARIES' || { echo 'BLOCKED: real narration timing missing'; exit 1; }
          test "$(jq -r '.decision' "$QC")" = 'PASS' || { echo 'BLOCKED: QC did not pass'; exit 1; }

      - name: Send review images and strict V3 video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || { echo 'Telegram secrets unavailable'; exit 1; }
          SCENE_DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"
          for IMG in "$SCENE_DIR"/*; do
            [ -f "$IMG" ] || continue
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "photo=@${IMG}" \
              -F "caption=🖼️ مراجعة المشهد | ${{ steps.story.outputs.slug }} | $(basename "$IMG")" >/dev/null
          done
          VIDEO="output/${{ steps.story.outputs.slug }}-preview.mp4"
          DURATION="$(jq -r '.duration_seconds' output/${{ steps.story.outputs.id }}-qc.json)"
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${VIDEO}" \
            -F "supports_streaming=true" \
            -F "caption=🎬 للمراجعة والموافقة | STRICT V3 GOLDEN\n✅ AI masters مستقلة + توقيت السرد + QC PASS\n⏱ ${DURATION}s\n${{ steps.story.outputs.slug }}\n\nرد بالموافقة أو الملاحظات قبل النشر." >/dev/null
          echo 'Telegram review delivery successful.'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.story.outputs.slug }}-v3-golden
          path: |
            assets/stories/${{ steps.story.outputs.slug }}/scenes/
            output/${{ steps.story.outputs.slug }}-preview.mp4
            output/${{ steps.story.outputs.slug }}-render.json
            output/${{ steps.story.outputs.id }}-qc.json
