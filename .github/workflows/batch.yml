name: Content Factory V3 Golden

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Content ID to render (strict V3 masters)'
        required: true
        default: '006'
  push:
    paths:
      - '.factory-trigger/**'

jobs:
  render-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip edge-tts pillow huggingface_hub
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core jq unzip
      - name: Enforce production architecture lock
        run: |
          test "$(jq -r '.architecture' config/production_mode.json)" = 'V3_GOLDEN_STRICT'
          test "$(jq -r '.production_locked' config/production_mode.json)" = 'true'
      - name: Build stable PNG brand logo
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          dst=Path('assets/brand/logo.png'); dst.parent.mkdir(parents=True,exist_ok=True)
          W,H=900,300; im=Image.new('RGBA',(W,H),(0,0,0,0)); d=ImageDraw.Draw(im)
          fp='/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf'
          if not Path(fp).exists(): fp='/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf'
          font=ImageFont.truetype(fp,92); small=ImageFont.truetype(fp,34)
          d.rounded_rectangle((18,18,882,282),radius=64,fill=(8,12,18,224),outline=(255,255,255,48),width=3)
          d.ellipse((62,67,230,235),outline=(255,255,255,230),width=12); d.polygon([(132,112),(132,190),(190,151)],fill=(255,255,255,235))
          d.text((830,72),'خلف الشاشة',font=font,fill=(255,255,255,255),anchor='ra',direction='rtl')
          d.text((825,190),'قصص ما وراء التقنية',font=small,fill=(220,225,232,220),anchor='ra',direction='rtl')
          im.save(dst,'PNG',optimize=True)
          PY
      - name: Resolve story
        id: story
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ID='${{ inputs.content_id }}'; else ID="$(printf '%s' '${{ github.event.head_commit.message }}' | grep -oE '[0-9]{3}' | head -n1)"; fi
          test -n "$ID" || ID=006
          STORY_DIR="$(find content -maxdepth 1 -type d -name "${ID}-*" | head -n1)"; test -n "$STORY_DIR"
          echo "id=$ID" >> "$GITHUB_OUTPUT"; echo "slug=$(basename "$STORY_DIR")" >> "$GITHUB_OUTPUT"
      - name: Recover 005 approved masters
        if: steps.story.outputs.id == '005'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"; mkdir -p "$DIR"
          COUNT="$(find "$DIR" -maxdepth 1 -type f -name '*.png' | wc -l)"
          if [ "$COUNT" -lt 7 ]; then
            curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/mohdassen/content-factory/actions/artifacts/9685349454/zip' -o /tmp/r28.zip
            rm -rf /tmp/r28; mkdir -p /tmp/r28; unzip -q /tmp/r28.zip -d /tmp/r28
            for N in 01 02 03 04 05 06 07; do ffmpeg -hide_banner -loglevel error -y -ss 0.10 -i "/tmp/r28/005-google-glass-segments/${N}.mp4" -frames:v 1 "$DIR/${N}.png"; done
          fi
      - name: Generate independent FLUX masters when missing
        env:
          HF_TOKEN: ${{ secrets.HF_Token }}
          IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
        run: |
          DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"; COUNT=0; [ -d "$DIR" ] && COUNT="$(find "$DIR" -maxdepth 1 -type f -name '*.png' | wc -l)"
          if [ "$COUNT" -lt 6 ]; then python scripts/generate_flux_masters.py --id '${{ steps.story.outputs.id }}'; fi
      - name: Generate narration
        run: python scripts/generate_voice_item.py --id '${{ steps.story.outputs.id }}'
      - name: Render video with mandatory cinematic outro
        run: python scripts/render_item.py --id '${{ steps.story.outputs.id }}'
      - name: Verify outro exists before QC and delivery
        run: |
          META="output/${{ steps.story.outputs.slug }}-render.json"
          test "$(jq -r '.cinematic_outro' "$META")" = 'true'
          OUTRO="$(jq -r '.outro_duration_seconds' "$META")"
          awk "BEGIN { exit !($OUTRO >= 2.0) }"
          test -s "output/${{ steps.story.outputs.slug }}-outro.mp4"
          echo "Cinematic outro verified: ${OUTRO}s"
      - name: Run technical quality gate
        run: python scripts/qc_video.py --id '${{ steps.story.outputs.id }}' --min-duration 35 --max-duration 75
      - name: Send final video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID"
          VIDEO="output/${{ steps.story.outputs.slug }}-preview.mp4"
          RESPONSE="$(curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@${VIDEO}" -F "supports_streaming=true" -F "caption=🎬 خلف الشاشة | ${{ steps.story.outputs.slug }}")"
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null
          echo "Telegram final video delivery successful. message_id=$(echo "$RESPONSE" | jq -r '.result.message_id')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.story.outputs.slug }}-flux-cinematic-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            output/
            assets/stories/${{ steps.story.outputs.slug }}/scenes/
            assets/stories/${{ steps.story.outputs.slug }}/masters-manifest.json
            assets/brand/logo.png
