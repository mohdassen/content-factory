name: Content Factory V3 Golden

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Content ID to render (strict V3 masters)'
        required: true
        default: '001'
  push:
    paths:
      - '.factory-trigger/**'

jobs:
  render-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enforce production architecture lock
        shell: bash
        run: |
          LOCK='config/production_mode.json'
          test -f "$LOCK" || { echo 'BLOCKED: production lock file missing'; exit 1; }
          test "$(jq -r '.architecture' "$LOCK")" = 'V3_GOLDEN_STRICT' || exit 1
          test "$(jq -r '.production_locked' "$LOCK")" = 'true' || exit 1
          test "$(jq -r '.approved_master_only' "$LOCK")" = 'true' || exit 1
          test "$(jq -r '.allow_stock_fallback' "$LOCK")" = 'false' || exit 1
          test "$(jq -r '.allow_storyboard_as_source' "$LOCK")" = 'false' || exit 1
          test "$(jq -r '.allow_motion_graphics_fallback' "$LOCK")" = 'false' || exit 1
          test "$(jq -r '.telegram_delivery_requires_strict_v3' "$LOCK")" = 'true' || exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install V3 production dependencies
        run: |
          python -m pip install --upgrade pip edge-tts pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core jq
          ffmpeg -version | head -n 3

      - name: Normalize approved brand logo to PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('assets/brand/logo.webp')
          dst = Path('assets/brand/logo.png')
          if not src.exists():
              raise SystemExit('BLOCKED: approved logo.webp missing')
          with Image.open(src) as im:
              im.load()
              if im.width < 64 or im.height < 64:
                  raise SystemExit(f'BLOCKED: invalid logo dimensions {im.width}x{im.height}')
              if im.mode not in ('RGB', 'RGBA'):
                  im = im.convert('RGBA')
              im.save(dst, 'PNG', optimize=True)
          with Image.open(dst) as check:
              check.verify()
          print(f'Brand logo normalized: {dst}')
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/render_item.py')
          s = p.read_text(encoding='utf-8')
          old = "logo = Path('assets') / 'brand' / 'logo.webp'"
          new = "logo = Path('assets') / 'brand' / 'logo.png'"
          if old not in s:
              raise SystemExit('Renderer logo reference not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of default=nw=1 assets/brand/logo.png

      - name: Resolve story
        id: story
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ID='${{ inputs.content_id }}'
          else
            ID="$(printf '%s' '${{ github.event.head_commit.message }}' | grep -oE '[0-9]{3}' | head -n1)"
            test -n "$ID" || { echo 'No 3-digit content id found in trigger commit message'; exit 1; }
          fi
          STORY_DIR="$(find content -maxdepth 1 -type d -name "${ID}-*" | head -n1)"
          test -n "$STORY_DIR" || { echo "Unknown content id: $ID"; exit 1; }
          SLUG="$(basename "$STORY_DIR")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Generate independent AI masters when missing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: gpt-image-1
          IMAGE_SIZE: 1024x1536
          IMAGE_QUALITY: high
        shell: bash
        run: |
          DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"
          COUNT=0
          if [ -d "$DIR" ]; then COUNT="$(find "$DIR" -maxdepth 1 -type f -name '*.png' | wc -l)"; fi
          if [ "$COUNT" -lt 6 ]; then
            python scripts/generate_ai_masters.py --id '${{ steps.story.outputs.id }}'
          else
            echo "Keeping $COUNT existing approved masters."
          fi

      - name: Strict V3 master preflight
        shell: bash
        run: |
          DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"
          test -d "$DIR" || exit 1
          COUNT="$(find "$DIR" -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) | wc -l)"
          test "$COUNT" -ge 6 || exit 1
          echo "Strict V3 preflight passed with $COUNT independent masters."

      - name: Generate Arabic narration and timing
        run: python scripts/generate_voice_item.py --id '${{ steps.story.outputs.id }}'

      - name: Render strict V3 cinematic MP4
        run: python scripts/render_item.py --id '${{ steps.story.outputs.id }}'

      - name: Publish renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-diagnostics-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/diagnostics/
            output/*-background.mp4
            output/*-segments/
            output/*.ass
            assets/brand/logo.png

      - name: Run technical quality gate
        run: python scripts/qc_video.py --id '${{ steps.story.outputs.id }}' --min-duration 35 --max-duration 70

      - name: Verify V3 architecture before delivery
        shell: bash
        run: |
          META="output/${{ steps.story.outputs.slug }}-render.json"
          QC="output/${{ steps.story.outputs.id }}-qc.json"
          test "$(jq -r '.architecture' "$META")" = 'V3_GOLDEN_STRICT' || exit 1
          test "$(jq -r '.renderer_mode' "$META")" = 'ROBUST_STAGED_V1' || exit 1
          test "$(jq -r '.all_visuals_are_approved_masters' "$META")" = 'true' || exit 1
          test "$(jq -r '.forbidden_fallbacks_enabled' "$META")" = 'false' || exit 1
          TIMING="$(jq -r '.narration_timing' "$META")"
          case "$TIMING" in
            REAL_WORD_BOUNDARIES|AUDIO_ALIGNED_WORD_TIMING) ;;
            *) echo "BLOCKED: invalid narration timing source: $TIMING"; exit 1 ;;
          esac
          test "$(jq -r '.scene_timing' "$META")" = 'NARRATION_PARAGRAPH_ALIGNED' || exit 1
          test "$(jq -r '.decision' "$QC")" = 'PASS' || exit 1

      - name: Create immutable versioned archive
        id: archive
        shell: bash
        run: |
          SLUG='${{ steps.story.outputs.slug }}'
          ID='${{ steps.story.outputs.id }}'
          VERSION="v$(printf '%03d' '${{ github.run_number }}')"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARCHIVE="archive/${SLUG}/${VERSION}-${STAMP}"
          mkdir -p "$ARCHIVE/scenes"
          cp "output/${SLUG}-preview.mp4" "$ARCHIVE/${SLUG}-${VERSION}.mp4"
          cp "output/${SLUG}-render.json" "$ARCHIVE/render.json"
          cp "output/${ID}-qc.json" "$ARCHIVE/qc.json"
          cp "output/${SLUG}-voice.mp3" "$ARCHIVE/voice.mp3"
          cp "output/${SLUG}-word-boundaries.json" "$ARCHIVE/timing.json"
          cp -a "assets/stories/${SLUG}/scenes/." "$ARCHIVE/scenes/"
          printf '{"story":"%s","version":"%s","created_utc":"%s","run_id":"%s","commit":"%s","architecture":"V3_GOLDEN_STRICT"}\n' "$SLUG" "$VERSION" "$STAMP" '${{ github.run_id }}' '${{ github.sha }}' > "$ARCHIVE/archive-manifest.json"
          echo "dir=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Send review images and strict V3 video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || exit 1
          SCENE_DIR="assets/stories/${{ steps.story.outputs.slug }}/scenes"
          for IMG in "$SCENE_DIR"/*; do
            [ -f "$IMG" ] || continue
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" -F "photo=@${IMG}" \
              -F "caption=🖼️ مراجعة المشهد | ${{ steps.story.outputs.slug }} | $(basename "$IMG")" >/dev/null
          done
          VIDEO="output/${{ steps.story.outputs.slug }}-preview.mp4"
          DURATION="$(jq -r '.duration_seconds' output/${{ steps.story.outputs.id }}-qc.json)"
          curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@${VIDEO}" -F "supports_streaming=true" \
            -F "caption=🎬 للمراجعة والموافقة | STRICT V3 GOLDEN | ${{ steps.archive.outputs.version }}\n✅ AI masters مستقلة + توقيت السرد + QC PASS\n⏱ ${DURATION}s\n${{ steps.story.outputs.slug }}" >/dev/null
          echo 'Telegram review delivery successful.'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.story.outputs.slug }}-${{ steps.archive.outputs.version }}-v3-golden
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ steps.archive.outputs.dir }}/
            output/${{ steps.story.outputs.slug }}-preview.mp4
