name: Content Factory Batch 001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/generate_voice_item.py'
      - 'scripts/render_item.py'
      - 'scripts/qc_video.py'
      - '.github/workflows/batch.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q

  render-batch:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        item:
          - { id: '001', slug: '001-netflix-blockbuster' }
          - { id: '002', slug: '002-kodak-digital-camera' }
          - { id: '003', slug: '003-costco-membership' }
          - { id: '004', slug: '004-nvidia-cuda' }
          - { id: '005', slug: '005-google-glass' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq
      - name: Generate Arabic narration
        run: python scripts/generate_voice_item.py --id "${{ matrix.item.id }}"
      - name: Render vertical MP4
        run: python scripts/render_item.py --id "${{ matrix.item.id }}"
      - name: Run technical quality gate
        run: python scripts/qc_video.py --id "${{ matrix.item.id }}" --min-duration 35 --max-duration 60
      - name: Send QC-passed video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DECISION="$(jq -r '.decision' output/${{ matrix.item.id }}-qc.json)"
          DURATION="$(jq -r '.duration_seconds' output/${{ matrix.item.id }}-qc.json)"
          if [ "$DECISION" != "PASS" ]; then
            echo "Telegram skipped: QC decision=$DECISION"
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram skipped: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not available in this repository."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@output/${{ matrix.item.slug }}-preview.mp4" \
            -F "supports_streaming=true" \
            -F "caption=🎬 Content Factory | ${{ matrix.item.id }}\n✅ QC: PASS\n⏱ ${DURATION}s\n${{ matrix.item.slug }}" >/dev/null
          echo "Telegram delivery successful for ${{ matrix.item.slug }}"
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.item.slug }}-voice
          path: output/${{ matrix.item.slug }}-voice.mp3
          if-no-files-found: error
      - name: Upload video preview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.item.slug }}-preview
          path: output/${{ matrix.item.slug }}-preview.mp4
          if-no-files-found: error
      - name: Upload QC report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.item.slug }}-qc
          path: output/${{ matrix.item.id }}-qc.json
          if-no-files-found: error

  batch-complete:
    if: ${{ always() }}
    needs: [validate, render-batch]
    runs-on: ubuntu-latest
    steps:
      - name: Report batch state
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "render-batch=${{ needs.render-batch.result }}"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.render-batch.result }}" = "success"
